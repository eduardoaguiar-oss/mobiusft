<!doctype html>
<html lang="pt-BR">

<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <title i18n="report.title">Mobius Forensic Toolkit Report</title>
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }

        .menu-item {
            transition: all 0.2s;
        }

        .menu-item:hover {
            background-color: #f1f5f9;
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .submenu.open {
            max-height: 2000px;
            /* Increased to support large nested forensic lists */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .active {
            background-color: #fefce8;
            border-left: 4px solid #eab308;
        }
    </style>
</head>

<body class="bg-zinc-100 min-h-screen overflow-hidden">

    <div class="flex h-screen">

        <!-- Persistent Left Sidebar -->
        <div class="w-auto bg-white border-r border-zinc-200 shadow-sm flex flex-col">

            <!-- Header -->
            <div class="px-6 py-6 border-b border-zinc-100 flex flex-col items-center text-center">
                <img src="img/icon.svg" alt="Mobius Forensic Toolkit Report" class="h-40 mb-4">
                <p><b><span i18n="report.title">Mobius Forensic Toolkit Report</span></b></p>
            </div>

            <!-- Menu -->
            <div class="flex-1 overflow-y-auto py-6 px-3 space-y-1">

                <!-- EXTRA PAGES SECTION -->
                <div id="extra-pages-container" class="space-y-1 mb-2">
                    <!-- Extra pages will be dynamically injected here -->
                </div>

                <!-- Separator -->
                <div id="extra-pages-separator" class="hidden mx-3 my-2">
                    <hr class="border-zinc-200">
                </div>

                <!-- Case Items Container -->
                <div id="direct-items-container" class="space-y-1">
                    <!-- Top-level forensic items will be dynamically injected here -->
                </div>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-zinc-100 text-center text-xs text-zinc-400">
                Mobius Forensic Toolkit • <span id="app-version">v2.28</span>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
            <div id="contentArea" class="flex-1 h-full min-h-0 overflow-hidden">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <!-- Load structural vectors using standardized deferred evaluation -->
    <script src="data/model.js" defer></script>

    <script>
        // Global Menu Toggler Function
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            const icon = document.getElementById(`icon-${menuId}`);
            if (menu) {
                menu.classList.toggle('open');
                if (icon) {
                    icon.style.transform = menu.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
                }
            }
        }

        // Create a menu item element recursively, including its metadata and children
        function createMenuItemElement(item, level = 0) {
            try {
                const wrapper = document.createElement('div');
                wrapper.className = level === 0 ? 'mx-2' : '';

                const nameMeta = item.metadata?.find(m => m.id === 'name');
                const idMeta = item.metadata?.find(m => m.id === 'id');

                const label = nameMeta?.value || idMeta?.value || `Item ${item.uid || ''}`;
                const hasRealChildren = Array.isArray(item.children) && item.children.length > 0;

                // ---------- HEADER ----------
                const headerContainer = document.createElement('div');
                headerContainer.className = 'flex items-center w-full rounded-2xl menu-item text-zinc-700 hover:text-zinc-900 cursor-pointer';

                // Left arrow (always present)
                const arrowIcon = document.createElement('i');
                arrowIcon.className = 'fa-solid fa-chevron-right text-xs text-zinc-400 w-5 text-center transition-transform duration-200 flex-shrink-0';
                headerContainer.appendChild(arrowIcon);

                // Icon + label
                const link = document.createElement('a');
                link.href = '#';
                link.className = `flex-1 flex items-center gap-3 px-3 py-2.5 submenu-item text-zinc-600 text-sm ${level ? 'text-xs py-1.5' : 'font-medium'}`;
                link.innerHTML = `
                    <img src="img/categories/${item.category}.png" alt="${label}"
                         class="w-8 h-8 object-contain inline-block"
                         onerror="this.src='img/evidences/default.png'">
                    <span class="truncate">${label}</span>
                `;

                headerContainer.appendChild(link);
                wrapper.appendChild(headerContainer);

                // ---------- SUB-ITEMS CONTAINER ----------
                const subItemsContainer = document.createElement('div');
                // Start CLOSED (no "open" class)
                subItemsContainer.className = 'submenu mt-1 space-y-0.5 border-l border-zinc-200 ml-5 pl-2';

                // 1. Metadata (always first)
                subItemsContainer.appendChild(createMetadataSubItem(item));

                // 2. Real children
                if (hasRealChildren) {
                    item.children.forEach(child => {
                        const childEl = createMenuItemElement(child, level + 1);
                        if (childEl) {
                            subItemsContainer.appendChild(childEl);
                        }
                    });
                }

                wrapper.appendChild(subItemsContainer);

                // ---------- TOGGLE LOGIC ----------
                const toggleDrawer = (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    const isOpen = subItemsContainer.classList.contains('open');

                    if (isOpen) {
                        subItemsContainer.classList.remove('open');
                        arrowIcon.style.transform = 'rotate(0deg)';
                    } else {
                        subItemsContainer.classList.add('open');
                        arrowIcon.style.transform = 'rotate(90deg)';
                    }
                };

                // Clicking the whole header expands/collapses
                headerContainer.addEventListener('click', toggleDrawer);

                // Active state
                link.addEventListener('click', (e) => {
                    document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                    link.classList.add('active');
                });

                return wrapper;

            } catch (err) {
                console.error('Error creating menu item:', err, item);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'text-red-500 text-xs px-5 py-1';
                errorDiv.textContent = 'Error loading item';
                return errorDiv;
            }
        }

        // Create a metadata sub-item for a given item
        function createMetadataSubItem(item) {
            const wrapper = document.createElement('div');

            const link = document.createElement('a');
            link.href = '#';
            link.className = 'flex items-center gap-3 px-5 py-1.5 submenu-item text-zinc-600 text-xs hover:text-zinc-900 rounded-lg';
            link.innerHTML = `
                <img src="img/info.png" class="w-5 h-5 object-contain inline-block"/>
                <span>Metadata</span>
            `;

            link.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation(); // important!

                document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                link.classList.add('active');

                const contentArea = document.getElementById('contentArea');
                if (contentArea) {
                    renderMetadataTable(item, contentArea);
                } else {
                    console.error('Element #contentArea not found');
                }
            });

            wrapper.appendChild(link);
            return wrapper;
        }


        // Render a metadata table for a given item into the target container
        function renderMetadataTable(item, targetContainer) {
            let html = `
                <div class="max-w-[90%] mx-auto bg-white rounded-xl shadow-sm border border-zinc-200 overflow-hidden h-full flex flex-col">
                    <!-- Title bar (similar to the old panel) -->
                    <div class="px-6 py-4 border-b border-zinc-200 bg-zinc-50 flex items-center gap-2 flex-shrink-0">
                        <i class="fa-solid fa-microchip text-zinc-400"></i>
                        <h3 class="text-lg font-bold text-zinc-900">
                            ${LANG['report.panel.case_info']}: ${item.name}
                        </h3>
                    </div>

                    <!-- Scrollable table area -->
                    <div class="flex-1 min-h-0 overflow-y-auto p-6">
                        <div class="overflow-x-auto border border-zinc-200 rounded-xl bg-white shadow-sm">
                            <table class="w-full border-collapse text-left text-sm text-slate-600">
                                <thead class="bg-slate-100 text-xs font-semibold uppercase tracking-wider text-slate-700 border-b border-slate-200 sticky top-0 z-10">
                                    <tr>
                                        <th scope="col" class="px-6 py-3.5 w-1/3">${LANG['text.property'] || 'Property'}</th>
                                        <th scope="col" class="px-6 py-3.5">${LANG['text.value'] || 'Value'}</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 bg-white">
                                    <tr class="hover:bg-slate-50/70 transition-colors">
                                        <td class="px-6 py-3.5 font-medium text-slate-900 bg-slate-50/30">Item UID</td>
                                        <td class="px-6 py-3.5 font-mono text-blue-600 font-bold">${item.uid}</td>
                                    </tr>
            `;

            item.metadata?.forEach(field => {
                if (field.id === 'uid') return;
                if (field.value && String(field.value).trim() !== '') {
                    html += `
                        <tr class="hover:bg-slate-50/70 transition-colors">
                            <td class="px-6 py-3.5 font-medium text-slate-900 bg-slate-50/30">${field.name}</td>
                            <td class="px-6 py-3.5 break-all font-sans">${field.value}</td>
                        </tr>
                    `;
                }
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            targetContainer.className = 'flex-1 h-full min-h-0 overflow-hidden p-6';
            targetContainer.innerHTML = html;
        }

        function populateCaseItems() {
            const container = document.getElementById('direct-items-container');
            if (!container) return;

            // Check window.ITEMS directly
            const sourceData = window.ITEMS;

            if (!sourceData || !Array.isArray(sourceData)) {
                container.innerHTML = '<div class="px-5 py-2 text-xs text-red-500"><span i18n="text.no_items">No items loaded</span></div>';
                return;
            }

            container.innerHTML = '';

            window.ITEMS.forEach(rootItem => {
                const el = createMenuItemElement(rootItem);
                if (el) {
                    container.appendChild(el);
                }
            });

            console.log('%c[Menu] Case Items tree assembled and populated successfully', 'color:#22c55e');

            const firstMenuItemLink = container.querySelector('.submenu-item');
            if (firstMenuItemLink) {
                firstMenuItemLink.click();
                firstMenuItemLink.classList.add('active');
                console.log(`%c[Automation] Automatically targeted and selected item node path UID: ${firstMenuItemLink.href.split('uid=')[1]}`, 'color:#3b82f6');
            }
        }

        function populateExtraPages() {
            const container = document.getElementById('extra-pages-container');
            const separator = document.getElementById('extra-pages-separator');

            if (!container || !window.EXTRA_PAGES || !Array.isArray(window.EXTRA_PAGES)) {
                if (separator) separator.classList.add('hidden');
                return;
            }

            container.innerHTML = '';

            if (window.EXTRA_PAGES.length === 0) {
                if (separator) separator.classList.add('hidden');
                return;
            }

            // Show separator
            if (separator) separator.classList.remove('hidden');

            window.EXTRA_PAGES.forEach(page => {
                const wrapper = document.createElement('div');
                wrapper.className = 'mx-2';

                const link = document.createElement('a');
                link.href = '#';
                link.className = 'flex items-center gap-3 px-5 py-2.5 rounded-2xl menu-item text-zinc-700 hover:text-zinc-900 text-sm font-medium submenu-item';

                if (page.type === 'info') {
                    link.innerHTML = `
                        <img src="img/info.png" alt="${page.title}" class="w-8 h-8 object-contain inline-block"/>
                        <span class="truncate">${page.title}</span>
                    `;
                } else if (page.type === 'help') {
                    link.innerHTML = `
                        <img src="img/help.png" alt="${page.title}" class="w-8 h-8 object-contain inline-block"/>
                        <span class="truncate">${page.title}</span>
                    `;
                } else {
                    link.innerHTML = `
                        <i class="fa-solid fa-info-circle w-4 flex-shrink-0 text-blue-500"></i>
                        <span class="truncate">${page.title}</span>
                    `;
                }

                link.addEventListener('click', (e) => {
                    e.preventDefault();

                    // Active state
                    document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                    link.classList.add('active');

                    // Load the static page into the new contentArea
                    loadExtraPageIntoContentArea(page.href);
                });

                wrapper.appendChild(link);
                container.appendChild(wrapper);
            });
        }


        /**
         * Loads a static HTML page into #contentArea using an iframe
         * (safe for existing static pages that may contain scripts / relative paths)
         */
        function loadExtraPageIntoContentArea(href) {
            const contentArea = document.getElementById('contentArea');
            if (!contentArea) {
                console.error('Element #contentArea not found');
                return;
            }

            // Clear previous content and create a full-height iframe
            contentArea.innerHTML = '';
            contentArea.className = 'flex-1 h-full min-h-0 overflow-hidden';

            const iframe = document.createElement('iframe');
            iframe.src = href;
            iframe.className = 'w-full h-full border-0';
            iframe.style.minHeight = '100%';

            contentArea.appendChild(iframe);
        }

        // =====================================================
        // Combined/Unified Safe Boot Execution Path
        // =====================================================
        window.addEventListener('load', () => {

            // Set app version
            const versionContainer = document.getElementById('app-version');
            if (versionContainer) {
                versionContainer.textContent = window.VERSION;
            }

            // Populate extra pages
            populateExtraPages();

            // Populate case items
            populateCaseItems();

            // Resolve layout menu container states cleanly
            const relatorios = document.getElementById('relatorios');
            const icon = document.getElementById('icon-relatorios');
            if (relatorios && icon) {
                relatorios.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        });

        function toggleMenu(section) {
            const submenu = document.getElementById(section);
            const icon = document.getElementById(`icon-${section}`);
            if (!submenu || !icon) return;

            document.querySelectorAll('.submenu').forEach(el => {
                if (el.id !== section) {
                    el.classList.remove('open');
                    const otherIcon = document.getElementById(`icon-${el.id}`);
                    if (otherIcon) otherIcon.style.transform = 'rotate(0deg)';
                }
            });

            submenu.classList.toggle('open');
            icon.style.transform = submenu.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }
    </script>

    <!-- Load language dictionary and populate fields -->
    <script src="data/lang.js"></script>
    <script>
        function populateI18N() {
            if (typeof window.LANG === 'undefined') {
                console.warn('Language dictionary (data/lang.js) not loaded');
                return;
            }

            document.querySelectorAll('[i18n]').forEach(element => {
                const key = element.getAttribute('i18n');
                const value = window.LANG[key];

                if (value !== undefined && value !== null && value !== '') {
                    element.textContent = value;
                } else {
                    element.textContent = '—';
                }
            });
        }

        // Populate when page loads
        document.addEventListener('DOMContentLoaded', populateI18N);
    </script>

</body>

</html>
