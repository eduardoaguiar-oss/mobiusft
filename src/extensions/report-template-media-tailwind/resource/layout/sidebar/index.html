<!doctype html>
<html lang="pt-BR">

<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <title i18n="report.title">Mobius Forensic Toolkit Report</title>
    <link rel="stylesheet" href="css/tailwind.min.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }

        .menu-item {
            transition: all 0.2s;
        }

        .menu-item:hover {
            background-color: #f1f5f9;
        }

        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .submenu.open {
            max-height: 2000px;
            /* Increased to support large nested forensic lists */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .active {
            background-color: #fefce8;
            border-left: 4px solid #eab308;
        }
    </style>
</head>

<body class="bg-zinc-100 min-h-screen overflow-hidden">

    <div class="flex h-screen">

        <!-- Persistent Left Sidebar -->
        <div class="w-auto bg-white border-r border-zinc-200 shadow-sm flex flex-col">

            <!-- Header -->
            <div class="px-6 py-6 border-b border-zinc-100 flex flex-col items-center text-center">
                <img src="img/icon.svg" alt="Mobius Forensic Toolkit Report" class="h-40 mb-4">
                <p><b><span i18n="report.title">Mobius Forensic Toolkit Report</span></b></p>
            </div>

            <!-- Menu -->
            <div class="flex-1 overflow-y-auto py-6 px-3 space-y-1">

                <!-- EXTRA PAGES SECTION -->
                <div id="extra-pages-container" class="space-y-1 mb-2">
                    <!-- Extra pages will be dynamically injected here -->
                </div>

                <!-- Separator -->
                <div id="extra-pages-separator" class="hidden mx-3 my-2">
                    <hr class="border-zinc-200">
                </div>

                <!-- Case Items Container -->
                <div id="direct-items-container" class="space-y-1">
                    <!-- Top-level forensic items will be dynamically injected here -->
                </div>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-zinc-100 text-center text-xs text-zinc-400">
                Mobius Forensic Toolkit • <span id="app-version">v2.28</span>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
            <div id="contentArea" class="flex-1 h-full min-h-0 overflow-hidden">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <!-- Load structural vectors using standardized deferred evaluation -->
    <script src="data/model.js" defer></script>

    <script>
        // Global Menu Toggler Function
        function toggleMenu(menuId) {
            const menu = document.getElementById(menuId);
            const icon = document.getElementById(`icon-${menuId}`);
            if (menu) {
                menu.classList.toggle('open');
                if (icon) {
                    icon.style.transform = menu.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
                }
            }
        }

        function createMenuItemElement(item, level = 0) {
            try {
                const wrapper = document.createElement('div');
                wrapper.className = level === 0 ? 'mx-2' : '';

                const nameMeta = item.metadata?.find(m => m.id === 'name');
                const idMeta   = item.metadata?.find(m => m.id === 'id');

                const label = nameMeta?.value || idMeta?.value || `Item ${item.uid || ''}`;
                const hasChildren = Array.isArray(item.children) && item.children.length > 0;
                const hasUfdr = Array.isArray(item.ufdr) && item.ufdr.length > 0;
                const hasVfs = item.vfs && typeof item.vfs === 'object' && !Array.isArray(item.vfs) && Object.keys(item.vfs).length > 0;
                const hasArtifacts = Object.values(item.evidence_counts || {}).some(count => count > 0);

                // ---------- HEADER ----------
                const headerContainer = document.createElement('div');
                headerContainer.className = 'flex items-center w-full rounded-2xl menu-item text-zinc-700 hover:text-zinc-900 cursor-pointer';

                const arrowIcon = document.createElement('i');
                arrowIcon.className = 'fa-solid fa-chevron-right text-xs text-zinc-400 w-5 text-center transition-transform duration-200 flex-shrink-0';
                headerContainer.appendChild(arrowIcon);

                const link = document.createElement('a');
                link.href = '#';
                link.className = `flex-1 flex items-center gap-3 px-3 py-2.5 submenu-item text-zinc-600 text-sm ${level ? 'text-xs py-1.5' : 'font-medium'}`;
                link.innerHTML = `
                    <img src="img/categories/${item.category}.png" alt="${label}"
                         class="w-8 h-8 object-contain inline-block"
                         onerror="this.src='img/evidences/default.png'">
                    <span class="truncate">${label}</span>
                `;

                headerContainer.appendChild(link);
                wrapper.appendChild(headerContainer);

                // ---------- SUB-ITEMS CONTAINER ----------
                const childrenContainer = document.createElement('div');
                childrenContainer.className = 'submenu mt-1 space-y-0.5 border-l border-zinc-200 ml-5 pl-2';

                // 1. Metadata (always)
                childrenContainer.appendChild(createMetadataMenuItemElement(item));
                
                // 2. VFS (if present)
                if (hasVfs) {
                    const vfsEl = createVFSMenuItemElement(item);
                    if (vfsEl) childrenContainer.appendChild(vfsEl);
                }

                // 3. UFDR group (if present)
                if (hasUfdr) {
                    const ufdrEl = createUFDRMenuItemElement(item, level + 1);
                    if (ufdrEl) childrenContainer.appendChild(ufdrEl);
                }

                // 4. Artifacts (if present)
                if (hasArtifacts) {
                    childrenContainer.appendChild(createArtifactMenuItemElement(item));
                }

                // 4. Real children
                if (hasChildren) {
                    item.children.forEach(child => {
                        const childEl = createMenuItemElement(child, level + 1);
                        if (childEl) childrenContainer.appendChild(childEl);
                    });
                }

                wrapper.appendChild(childrenContainer);

                // ---------- CLICK BEHAVIOUR ----------
                headerContainer.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();

                    document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                    link.classList.add('active');

                    const isOpen = childrenContainer.classList.contains('open');
                    if (isOpen) {
                        childrenContainer.classList.remove('open');
                        arrowIcon.style.transform = 'rotate(0deg)';
                    } else {
                        childrenContainer.classList.add('open');
                        arrowIcon.style.transform = 'rotate(90deg)';
                    }
                });

                return wrapper;

            } catch (err) {
                console.error('Error creating menu item:', err, item);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'text-red-500 text-xs px-5 py-1';
                errorDiv.textContent = 'Error loading item';
                return errorDiv;
            }
        }


        /**
         * Creates the "Artifacts" submenu item.
         * Clicking it calls renderArtifactMasterList(item).
         */
        function createArtifactMenuItemElement(item) {
            const wrapper = document.createElement('div');

            const link = document.createElement('a');
            link.href = '#';
            link.className = 'ml-4 flex items-center gap-3 px-5 py-1.5 submenu-item text-zinc-600 text-xs hover:text-zinc-900 rounded-lg';
            link.innerHTML = `
                <img src="img/artifacts.png" class="w-8 h-8 object-contain inline-block"/>
                <span>${LANG['report.menuitem.artifacts'] || 'Artifacts'}</span>
            `;

            link.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                link.classList.add('active');

                renderArtifactMasterList(item);
            });

            wrapper.appendChild(link);
            return wrapper;
        }

        /**
         * Creates the "Metadata" submenu item.
         * Clicking it calls renderMetadataTable(item).
         */
        function createMetadataMenuItemElement(item) {
            const wrapper = document.createElement('div');

            const link = document.createElement('a');
            link.href = '#';
            link.className = 'ml-4 flex items-center gap-3 px-5 py-1.5 submenu-item text-zinc-600 text-xs hover:text-zinc-900 rounded-lg';
            link.innerHTML = `
                <img src="img/info.png" class="w-8 h-8 object-contain inline-block"/>
                <span>${LANG['report.menuitem.metadata'] || 'Metadata'}</span>
            `;

            link.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                link.classList.add('active');

                renderMetadataTable(item);
            });

            wrapper.appendChild(link);
            return wrapper;
        }
        
        /**
         * Creates the "UFDR Data" group and one sub-item per UFDR row.
         * Clicking a row shows its details directly (no master table).
         */
        /**
         * Creates the "UFDR Data" submenu item.
         * Clicking it calls renderUFDRMasterList(item).
         */
        function createUFDRMenuItemElement(item) {
            const wrapper = document.createElement('div');

            const link = document.createElement('a');
            link.href = '#';
            link.className = 'ml-4 flex items-center gap-3 px-5 py-1.5 submenu-item text-zinc-600 text-xs hover:text-zinc-900 rounded-lg';
            link.innerHTML = `
                <img src="img/ufdr.png" class="w-8 h-8 object-contain inline-block"/>
                <span>${LANG['report.menuitem.ufdr'] || 'UFDR Data'}</span>
            `;

            link.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                link.classList.add('active');

                renderUFDRMasterList(item);
            });

            wrapper.appendChild(link);
            return wrapper;
        }


        /**
         * Creates the "Virtual File System (VFS)" submenu item.
         * Clicking it calls renderVfsMasterList(item).
         */
        function createVFSMenuItemElement(item) {
            const wrapper = document.createElement('div');

            const link = document.createElement('a');
            link.href = '#';
            link.className = 'ml-4 flex items-center gap-3 px-5 py-1.5 submenu-item text-zinc-600 text-xs hover:text-zinc-900 rounded-lg';
            link.innerHTML = `
                <img src="img/vfs.png" class="w-8 h-8 object-contain inline-block"/>
                <span>${LANG['report.menuitem.vfs'] || 'Virtual File System (VFS)'}</span>
            `;

            link.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                link.classList.add('active');

                renderVfsMasterList(item);
            });

            wrapper.appendChild(link);
            return wrapper;
        }

        function populateCaseItems() {
            const container = document.getElementById('direct-items-container');
            if (!container) return;

            // Check window.ITEMS directly
            const sourceData = window.ITEMS;

            if (!sourceData || !Array.isArray(sourceData)) {
                container.innerHTML = '<div class="px-5 py-2 text-xs text-red-500"><span i18n="text.no_items">No items loaded</span></div>';
                return;
            }

            container.innerHTML = '';

            window.ITEMS.forEach(rootItem => {
                const el = createMenuItemElement(rootItem);
                if (el) {
                    container.appendChild(el);
                }
            });

            console.log('%c[Menu] Case Items tree assembled and populated successfully', 'color:#22c55e');

            const firstMenuItemLink = container.querySelector('.submenu-item');
            if (firstMenuItemLink) {
                firstMenuItemLink.click();
                firstMenuItemLink.classList.add('active');
                console.log(`%c[Automation] Automatically targeted and selected item node path UID: ${firstMenuItemLink.href.split('uid=')[1]}`, 'color:#3b82f6');
            }
        }

        function populateExtraPages() {
            const container = document.getElementById('extra-pages-container');
            const separator = document.getElementById('extra-pages-separator');

            if (!container || !window.EXTRA_PAGES || !Array.isArray(window.EXTRA_PAGES)) {
                if (separator) separator.classList.add('hidden');
                return;
            }

            container.innerHTML = '';

            if (window.EXTRA_PAGES.length === 0) {
                if (separator) separator.classList.add('hidden');
                return;
            }

            // Show separator
            if (separator) separator.classList.remove('hidden');

            window.EXTRA_PAGES.forEach(page => {
                const wrapper = document.createElement('div');
                wrapper.className = 'mx-2';

                const link = document.createElement('a');
                link.href = '#';
                link.className = 'flex items-center gap-3 px-5 py-2.5 rounded-2xl menu-item text-zinc-700 hover:text-zinc-900 text-sm font-medium submenu-item';

                if (page.type === 'info') {
                    link.innerHTML = `
                        <img src="img/info.png" alt="${page.title}" class="w-8 h-8 object-contain inline-block"/>
                        <span class="truncate">${page.title}</span>
                    `;
                } else if (page.type === 'help') {
                    link.innerHTML = `
                        <img src="img/help.png" alt="${page.title}" class="w-8 h-8 object-contain inline-block"/>
                        <span class="truncate">${page.title}</span>
                    `;
                } else {
                    link.innerHTML = `
                        <i class="fa-solid fa-info-circle w-4 flex-shrink-0 text-blue-500"></i>
                        <span class="truncate">${page.title}</span>
                    `;
                }

                link.addEventListener('click', (e) => {
                    e.preventDefault();

                    // Active state
                    document.querySelectorAll('.submenu-item').forEach(el => el.classList.remove('active'));
                    link.classList.add('active');

                    // Load the static page into the new contentArea
                    loadExtraPageIntoContentArea(page.href);
                });

                wrapper.appendChild(link);
                container.appendChild(wrapper);
            });
        }

        /**
         * Loads a static HTML page into #contentArea using an iframe
         * (safe for existing static pages that may contain scripts / relative paths)
         */
        function loadExtraPageIntoContentArea(href) {
            const contentArea = document.getElementById('contentArea');
            if (!contentArea) {
                console.error('Element #contentArea not found');
                return;
            }

            // Clear previous content and create a full-height iframe
            contentArea.innerHTML = '';
            contentArea.className = 'flex-1 h-full min-h-0 overflow-hidden';

            const iframe = document.createElement('iframe');
            iframe.src = href;
            iframe.className = 'w-full h-full border-0';
            iframe.style.minHeight = '100%';

            contentArea.appendChild(iframe);
        }

        function renderMetadataTable(item) {
            const contentArea = document.getElementById('contentArea');
            if (!contentArea) return;

            let html = `
                <div class="max-w-[90%] mx-auto bg-white rounded-xl shadow-sm border border-zinc-200 overflow-hidden h-full flex flex-col">
                    <!-- Title bar (similar to the old panel) -->
                    <div class="px-6 py-4 border-b border-zinc-200 bg-zinc-50 flex items-center gap-2 flex-shrink-0">
                        <i class="fa-solid fa-microchip text-zinc-400"></i>
                        <h3 class="text-lg font-bold text-zinc-900">
                            ${LANG['report.panel.case_info']}: ${item.name}
                        </h3>
                    </div>

                    <!-- Scrollable table area -->
                    <div class="flex-1 min-h-0 overflow-y-auto p-6">
                        <div class="overflow-x-auto border border-zinc-200 rounded-xl bg-white shadow-sm">
                            <table class="w-full border-collapse text-left text-sm text-slate-600">
                                <thead class="bg-slate-100 text-xs font-semibold uppercase tracking-wider text-slate-700 border-b border-slate-200 sticky top-0 z-10">
                                    <tr>
                                        <th scope="col" class="px-6 py-3.5 w-1/3">${LANG['text.property'] || 'Property'}</th>
                                        <th scope="col" class="px-6 py-3.5">${LANG['text.value'] || 'Value'}</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 bg-white">
                                    <tr class="hover:bg-slate-50/70 transition-colors">
                                        <td class="px-6 py-3.5 font-medium text-slate-900 bg-slate-50/30">Item UID</td>
                                        <td class="px-6 py-3.5 font-mono text-blue-600 font-bold">${item.uid}</td>
                                    </tr>
            `;

            item.metadata?.forEach(field => {
                if (field.id === 'uid') return;
                if (field.value && String(field.value).trim() !== '') {
                    html += `
                        <tr class="hover:bg-slate-50/70 transition-colors">
                            <td class="px-6 py-3.5 font-medium text-slate-900 bg-slate-50/30">${field.name}</td>
                            <td class="px-6 py-3.5 break-all font-sans">${field.value}</td>
                        </tr>
                    `;
                }
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            contentArea.className = 'flex-1 h-full min-h-0 overflow-hidden p-6';
            contentArea.innerHTML = html;
        }

        /**
         * Renders the Master selection table under the UFDR Reports tab
         * using the current item's dynamic forensic vector block.
         */
        function renderUFDRMasterList(currentItem) {
            const contentArea = document.getElementById('contentArea');
            if (!contentArea) return;

            // Outer card – same style as renderMetadataTable
            contentArea.className = 'flex-1 h-full min-h-0 overflow-hidden p-6';
            contentArea.innerHTML = `
                <div class="max-w-[90%] mx-auto bg-white rounded-xl shadow-sm border border-zinc-200 overflow-hidden h-full flex flex-col">
                    <!-- Title bar -->
                    <div class="px-6 py-4 border-b border-zinc-200 bg-zinc-50 flex-shrink-0">
                        <h3 class="text-lg font-bold text-zinc-900 flex items-center gap-2">
                            <i class="fa-solid fa-mobile-screen-button text-teal-600"></i>
                            <span>${LANG['report.panel.ufdr'] || 'UFDR Data'}</span>
                        </h3>
                        <p class="text-zinc-500 text-sm mt-1">
                            ${LANG['text.select_row'] || 'Select a row to view metadata.'}
                        </p>
                    </div>

                    <!-- Body -->
                    <div class="flex-1 flex flex-col min-h-0 p-6 space-y-4 overflow-hidden">
                        <!-- MASTER SECTION (TOP) -->
                        <div class="flex-shrink-0 max-h-[40%] flex flex-col border border-zinc-200 rounded-xl bg-white shadow-sm overflow-hidden">
                            <div class="overflow-y-auto flex-1 min-h-0">
                                <table class="w-full border-collapse text-left text-xs text-zinc-600">
                                    <thead class="bg-zinc-50 border-b border-zinc-200 text-[10px] font-bold uppercase tracking-wider text-zinc-500 sticky top-0 z-10">
                                        <tr>
                                            <th scope="col" class="px-4 py-2.5 w-12 text-center"></th>
                                            <th scope="col" class="px-4 py-2.5">${LANG['text.description'] || 'Description'}</th>
                                        </tr>
                                    </thead>
                                    <tbody id="ufdr-master-table-body" class="divide-y divide-zinc-100 bg-white">
                                        <!-- rows injected below -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- DETAIL SECTION (BOTTOM) -->
                        <div class="flex-1 flex flex-col border border-zinc-200 rounded-xl bg-white p-3 shadow-sm min-h-0 overflow-y-auto">
                            <div id="ufdr-details-container" class="text-center py-16 text-zinc-400 italic">
                                <i class="fa-solid fa-arrow-pointer text-2xl mb-2 text-zinc-300 block"></i>
                                <span>${LANG['text.select_row'] || 'Select a row to view metadata.'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const tbody = document.getElementById('ufdr-master-table-body');
            const detailContent = document.getElementById('ufdr-details-container');

            // Empty / invalid state
            if (!currentItem || !currentItem.ufdr || !Array.isArray(currentItem.ufdr) || currentItem.ufdr.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="text-zinc-400 text-xs px-4 py-6 italic text-center">
                            No UFDR data available.
                        </td>
                    </tr>
                `;
                if (detailContent) {
                    detailContent.innerHTML = `
                        <div class="text-center py-16 text-zinc-400 italic">
                            <i class="fa-solid fa-ban text-2xl mb-2 text-zinc-300 block"></i>
                            ${LANG['text.no_metadata'] || 'No metadata available.'}
                        </div>
                    `;
                }
                return;
            }

            // Populate master list
            currentItem.ufdr.forEach((row, index) => {
                let iconClass = 'fa-file text-zinc-400';
                let labelText = '';

                if (row.type === 'case_info') {
                    iconClass = 'fa-circle-info text-blue-500';
                    labelText = LANG['text.case_info'] || 'Case Info';
                } else if (row.type === 'extraction') {
                    iconClass = 'fa-microchip text-amber-500';
                    labelText = `${LANG['text.extraction'] || 'Extraction'}: ${row.name || 'Unlabeled'}`;
                } else {
                    labelText = row.description || `Log Record #${index + 1}`;
                }

                const tr = document.createElement('tr');
                tr.className = 'cursor-pointer hover:bg-zinc-50 transition-colors text-zinc-600';
                tr.innerHTML = `
                    <td class="px-4 py-2.5 text-center flex-shrink-0">
                        <i class="fa-solid ${iconClass} text-sm w-4"></i>
                    </td>
                    <td class="px-4 py-2.5 font-semibold text-zinc-700 truncate">
                        ${labelText}
                    </td>
                `;

                tr.addEventListener('click', () => {
                    // Clear active state from siblings
                    tbody.querySelectorAll('tr').forEach(r => {
                        r.classList.remove('bg-zinc-100', 'text-zinc-900');
                        r.classList.add('hover:bg-zinc-50');
                    });

                    // Apply active state
                    tr.classList.remove('hover:bg-zinc-50');
                    tr.classList.add('bg-zinc-100', 'text-zinc-900');

                    // Show details
                    showUfdrDetails(row);
                });

                tbody.appendChild(tr);

                // Auto-select first row
                if (index === 0) {
                    tr.click();
                }
            });
        }

        /**
         * Builds and mounts the UFDR Detail view contents from the selected row object
         */
        function showUfdrDetails(row) {
            const detailContent = document.getElementById('ufdr-details-container');
            if (!detailContent) return;

            let metaRows = '';
            
            // Parse the inner metadata array inside the selected row object
            if (row.metadata && row.metadata.length > 0) {
                row.metadata.forEach(meta => {
                    metaRows += `
                        <div class="flex justify-between py-1.5 border-b border-zinc-100 text-xs gap-4">
                            <span class="text-zinc-500 font-medium whitespace-nowrap">${meta.name}</span>
                            <span class="font-semibold text-zinc-700 text-right break-all">${meta.value}</span>
                        </div>
                    `;
                });
            } else {
                metaRows = `<p class="text-xs italic text-zinc-400 py-6 text-center">${LANG['text.no_metadata']}</p>`;
            }

            // Determine formatting based on the record structural classification type
            const isCaseInfo = row.type === 'case_info';
            const headerTitle = isCaseInfo ? `${LANG['report.section.case_details']}` : `${LANG['report.section.extraction_metadata']}`;
            const headerSub = isCaseInfo ? `${LANG['text.general_info']}` : `${LANG['text.extraction']}: ${row.name || 'Unlabeled'}`;
            const trackingIcon = isCaseInfo ? 'fa-circle-info text-blue-500' : 'fa-microchip text-amber-500';

            detailContent.innerHTML = `
                <div class="text-left p-2">
                    <div class="border-b border-zinc-200 pb-3 mb-4 flex items-center justify-between">
                        <div>
                            <h4 class="text-sm font-bold text-zinc-900">${headerTitle}</h4>
                            <p class="text-[10px] text-zinc-400 font-mono mt-0.5">${headerSub}</p>
                        </div>
                        <i class="fa-solid ${trackingIcon} text-lg"></i>
                    </div>
                    
                    <div class="space-y-1">
                        <div class="flex justify-between py-1.5 border-b border-zinc-100 text-xs">
                            <span class="text-zinc-500 font-medium">Record Type</span>
                            <span class="font-bold text-zinc-700 capitalize">${row.type}</span>
                        </div>
                        ${metaRows}
                    </div>
                </div>
            `;
        }

        // Map file icons to types cleanly
        function getVfsIcon(type) {
            switch (type) {
                case 'imagefile': return 'fa-database text-slate-500';
                case 'partition_system': return 'fa-shield-halved text-blue-500';
                case 'partition': return 'fa-server text-indigo-500';
                case 'filesystem': return 'fa-folder-open text-amber-500';
                case 'freespace': return 'fa-border-none text-zinc-400';
                case 'apfs.container': return 'fa-shield-halved text-blue-500';
                case 'apfs.volume': return 'fa-folder-open text-amber-500';
                case 'mbr': case 'gpt.header': case 'gpt.table': return 'fa-file-code text-teal-600';
                default: return 'fa-file text-zinc-400';
            }
        }

        // Convert bytes count to formatted size string
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        /**
         * Renders the stacked bottom layout containing artifact records on top and metadata attributes below
         * @param {Object} selectedItem - The current active item (contains selectedItem.uid or selectedItem.id)
         * @param {Object} type - The artifact type schema block containing columns structural configuration
         */
        function renderSplitArtifactDetails(selectedItem, type) {
            const detailsContainer = document.getElementById('artifact-details-container');
            if (!detailsContainer || !selectedItem || !type) return;

            // Direct the layout engine to stack containers while filling 100% space
            detailsContainer.className = "flex flex-col min-h-0 gap-4 overflow-hidden";
            detailsContainer.style.height = "70%";

            const listContainer = detailsContainer.children[0];
            const metaContainer = detailsContainer.children[1];

            if (!listContainer || !metaContainer) return;

            // Force panels to span full widths and split vertical territory proportionally
            listContainer.className = "w-full flex flex-col border border-zinc-200 rounded-xl bg-white p-3 shadow-sm overflow-hidden";
            metaContainer.className = "w-full flex flex-col border border-zinc-200 rounded-xl bg-white p-3 shadow-sm overflow-hidden";
            
            // Explicitly lock heights to an exact split to prevent collapsing or expansion errors
            listContainer.style.height = "calc(50% - 8px)";
            metaContainer.style.height = "calc(50% - 8px)";
            listContainer.style.display = "flex";
            listContainer.style.flexDirection = "column";
            metaContainer.style.overflowY = "auto";

            // 1. Show a loading visual inside the containers while fetching the external file
            listContainer.innerHTML = `
                <div class="text-center py-6 text-zinc-400 italic my-auto w-full">
                    <i class="fa-solid fa-spinner fa-spin text-xl mb-1 text-teal-500 block"></i>
                    ${LANG['text.load_artifacts'] || 'Loading records...'}
                </div>`;
            metaContainer.innerHTML = `
                <div class="text-center py-6 text-zinc-400 italic my-auto w-full">
                    <i class="fa-solid fa-circle-info text-xl mb-1 text-zinc-300 block"></i>
                    ${LANG['text.select_row']}.
                </div>`;

            // 2. Pad the item UID to a 4-digit formatted string context (e.g., 5 -> "0005")
            const itemUid = selectedItem.uid !== undefined ? selectedItem.uid : selectedItem.id;
            const paddedUid = String(itemUid).padStart(4, '0');
            const scriptUrl = `data/${paddedUid}/${type.id}.js`;

            // 3. Remove existing hidden loader iframes to keep local memory space optimized
            const existingIframe = document.getElementById('offline-artifact-sandbox');
            if (existingIframe) existingIframe.remove();

            // 4. Create an isolated hidden iframe workspace to load the asset file safely
            const iframe = document.createElement('iframe');
            iframe.id = 'offline-artifact-sandbox';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            // 5. Build dynamic script via standard DOM methods to avoid literal string parsing drops
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write('<!DOCTYPE html><html><head></head><body></body></html>');
            iframeDoc.close();

            // Create the target source file script element inside the child context
            const dataScript = iframeDoc.createElement('script');
            dataScript.src = scriptUrl;

            // Create the message messenger execution block inside the child context
            const actionScript = iframeDoc.createElement('script');
            actionScript.textContent = `
                window.addEventListener('load', function() {
                    window.parent.postMessage({ 
                        status: 'success', 
                        records: (typeof EVIDENCES !== 'undefined') ? EVIDENCES : [] 
                    }, '*');
                });
            `;

            // 6. Listen for the internal sandbox window completion message
            window.onmessage = (event) => {
                if (!event.data || event.data.status !== 'success') return;
                
                // Unbind the layout listener event context cleanly to prevent ghost memory tracking leaks
                window.onmessage = null; 

                // Track raw records and preserve original index sequence for sorting resets
                const rawRecords = event.data.records || [];
                const records = rawRecords.map((rec, index) => ({ ...rec, _originalIndex: index }));
                
                if (records.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-6 text-zinc-400 italic my-auto w-full">
                            <i class="fa-solid fa-folder-open text-xl mb-1 text-zinc-300 block"></i>
                            No artifact records found.
                        </div>`;
                    return;
                }

                // 7. Read ALL columns from type.columns schema definition
                const targetColumns = (type.columns && type.columns.length > 0) 
                    ? type.columns 
                    : [{ id: 'username', name: 'User' }];

                // Track state across the entire header row framework
                // activeSortField can be 'alert-col' or any valid schema col.id
                let activeSortField = 'none'; 
                let activeSortOrder = 'none'; // 'none' | 'asc' | 'desc'

                // Find if a specific schema column is configured to sort automatically by default
                const defaultSortCol = targetColumns.find(col => col.first_sortable);
                if (defaultSortCol) {
                    activeSortField = defaultSortCol.id;
                    activeSortOrder = 'asc';
                }

                // 8. Generate Container Layout dynamically with solid overflow configurations
                listContainer.innerHTML = `
                    <div class="flex flex-col w-full h-full min-h-0 overflow-hidden">
                        <div class="flex items-center justify-between pb-2 mb-2 border-b border-zinc-100 flex-shrink-0">
                            <span class="text-xs font-bold text-zinc-700 uppercase tracking-wider">${LANG['report.section.artifacts']}</span>
                            <span class="text-[10px] bg-zinc-100 text-zinc-600 px-1.5 py-0.5 rounded font-bold font-mono">${records.length}</span>
                        </div>
                        
                        <!-- AUTO SCROLL REGION -->
                        <div class="flex-1 min-h-0 overflow-auto border border-zinc-100 rounded-lg bg-white relative">
                            <table class="min-w-full border-collapse text-left text-xs text-zinc-600">
                                <thead class="bg-zinc-50 border-b border-zinc-200 text-[10px] font-bold uppercase tracking-wider text-zinc-500 sticky top-0 z-10">
                                    <tr>
                                        <!-- Sortable Alert Header (treated as always sortable) -->
                                        <th scope="col" data-sort-id="alert-col" class="px-2 py-2 bg-zinc-50 w-10 text-center cursor-pointer select-none hover:bg-zinc-100 group transition-colors duration-150">
                                            <span class="flex items-center justify-center gap-0.5 text-zinc-400 group-hover:text-zinc-600">
                                                <i class="sort-icon fa-solid fa-sort text-[8px]"></i>
                                            </span>
                                        </th>
                                        ${targetColumns.map(col => {
                                            const sortableClass = col.is_sortable || col.first_sortable ? 'cursor-pointer select-none hover:bg-zinc-100 group' : '';
                                            return `
                                                <th scope="col" data-sort-id="${col.id}" class="px-3 py-2 bg-zinc-50 whitespace-nowrap min-w-[120px] max-w-[200px] truncate ${sortableClass}">
                                                    <div class="flex items-center gap-1">
                                                        <span>${LANG['column.' + type.id + '.' + col.id] || LANG['column.' + col.id] || col.name || col.id}</span>
                                                        ${col.is_sortable || col.first_sortable ? `<i class="sort-icon fa-solid fa-sort text-[8px] text-zinc-300 group-hover:text-zinc-500 transition-colors"></i>` : ''}
                                                    </div>
                                                </th>`;
                                        }).join('')}
                                    </tr>
                                </thead>
                                <tbody id="artifact-sub-table-body" class="divide-y divide-zinc-100 bg-white">
                                </tbody>
                            </table>
                        </div>
                    </div>`;

                const subTableBody = document.getElementById('artifact-sub-table-body');
                const headerCells = listContainer.querySelectorAll('thead th');

                // 9. Standard Dynamic Row Builder
                function populateTableRows(dataset) {
                    subTableBody.innerHTML = '';
                    
                    dataset.forEach((record) => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-zinc-50 cursor-pointer transition-colors duration-150 h-8 text-[11px]';
                        
                        // Strict inspection of root record.tags array
                        const hasRowAlert = Array.isArray(record.tags) && record.tags.includes('alert');
                        const alertCell = `
                            <td class="px-2 py-1 text-center w-10 select-none">
                                ${hasRowAlert ? '<img src="img/alert.png" class="w-5 h-5 object-contain inline-block"/>' : ''}
                            </td>`;

                        const dataCells = targetColumns.map(col => {
                            const rawVal = record.attrs?.[col.id] || '';
                            return `
                                <td class="px-3 py-1 truncate text-zinc-800 font-medium whitespace-nowrap max-w-[200px]">
                                    ${rawVal}
                                </td>`;
                        }).join('');

                        tr.innerHTML = alertCell + dataCells;

                        // Click Interaction to populate the Metadata Viewer below
                        tr.addEventListener('click', () => {
                            subTableBody.querySelectorAll('tr').forEach(r => r.classList.remove('bg-teal-50/50', 'border-l-2', 'border-teal-500'));
                            tr.classList.add('bg-teal-50/50', 'border-l-2', 'border-teal-500');
                            renderArtifactMetadata(record, metaContainer);
                        });

                        subTableBody.appendChild(tr);
                    });
                }

                // 10. Centralized UI icon update coordinator 
                function updateSortUI() {
                    headerCells.forEach(th => {
                        const icon = th.querySelector('.sort-icon');
                        if (!icon) return;

                        const fieldId = th.getAttribute('data-sort-id');
                        if (fieldId === activeSortField) {
                            if (activeSortOrder === 'asc') {
                                icon.className = 'sort-icon fa-solid fa-sort-up text-teal-600 text-[8px]';
                            } else if (activeSortOrder === 'desc') {
                                icon.className = 'sort-icon fa-solid fa-sort-down text-teal-600 text-[8px]';
                            } else {
                                icon.className = 'sort-icon fa-solid fa-sort text-zinc-300 text-[8px]';
                            }
                        } else {
                            // Reset matching styles back to baseline rules
                            icon.className = `sort-icon fa-solid fa-sort text-[8px] ${fieldId === 'alert-col' ? 'text-zinc-400' : 'text-zinc-300'}`;
                        }
                    });
                }

                // 11. Unified Sorting Engine Logic
                function executeSorting() {
                    let sortedData = [...records];

                    if (activeSortOrder === 'none') {
                        // Reset back to file default index layout sequence
                        sortedData.sort((a, b) => a._originalIndex - b._originalIndex);
                        populateTableRows(sortedData);
                        updateSortUI();
                        return;
                    }

                    sortedData.sort((a, b) => {
                        let valA, valB;

                        if (activeSortField === 'alert-col') {
                            valA = Array.isArray(a.tags) && a.tags.includes('alert') ? 1 : 0;
                            valB = Array.isArray(b.tags) && b.tags.includes('alert') ? 1 : 0;
                        } else {
                            // Fetch content under target dataset columns
                            valA = (a.attrs?.[activeSortField] ?? '').toString().toLowerCase();
                            valB = (b.attrs?.[activeSortField] ?? '').toString().toLowerCase();
                        }

                        if (valA < valB) return activeSortOrder === 'asc' ? -1 : 1;
                        if (valA > valB) return activeSortOrder === 'asc' ? 1 : -1;
                        return 0;
                    });

                    populateTableRows(sortedData);
                    updateSortUI();
                }

                // 12. Mount Events for interacting with Schema Layout items
                headerCells.forEach(th => {
                    const fieldId = th.getAttribute('data-sort-id');
                    
                    // Match configurations setup inside your schema blocks
                    const isAlert = fieldId === 'alert-col';
                    const targetSchemaCol = targetColumns.find(c => c.id === fieldId);
                    const isSortable = isAlert || (targetSchemaCol && (targetSchemaCol.is_sortable || targetSchemaCol.first_sortable));

                    if (!isSortable) return;

                    th.addEventListener('click', () => {
                        if (activeSortField === fieldId) {
                            // Alternate loop paths across click cycles (Ascending -> Descending -> None)
                            if (activeSortOrder === 'asc') activeSortOrder = 'desc';
                            else if (activeSortOrder === 'desc') activeSortOrder = 'none';
                            else activeSortOrder = 'asc';
                        } else {
                            activeSortField = fieldId;
                            activeSortOrder = 'asc';
                        }
                        executeSorting();
                    });
                });

                // Apply initial layout configurations if default flags exist
                executeSorting();
            };

            // Inject the DOM elements sequentially into the iframe to run safely offline
            iframeDoc.head.appendChild(dataScript);
            iframeDoc.head.appendChild(actionScript);
        }

        /**
         * Builds a structured, scrollable table layout for selected sub-items
         * @param {Object} record - Individual evidence entry configuration containing attributes, tags, metadata, and hashes
         * @param {HTMLElement} container - Target metadata viewer container context
         */
        function renderArtifactMetadata(record, container) {
            if (!record) return;

            // 1. Process Core Attributes (Sorted alphabetically by key name)
            const sortedAttributes = record.attrs 
                ? Object.entries(record.attrs).sort(([keyA], [keyB]) => keyA.localeCompare(keyB))
                : [];

            // 2. Process and format remaining data blocks safely using array copies
            const sortedTags = record.tags && record.tags.length > 0 
                ? [...record.tags].sort().join(', ') 
                : '-';

            const sortedMetadata = record.metadata && record.metadata.length > 0
                ? [...record.metadata].sort((a, b) => (a.name || '').localeCompare(b.name || ''))
                : [];

            const hashEntries = record.hashes 
                ? Object.entries(record.hashes).sort((a, b) => a.localeCompare(b)) 
                : [];

            // 3. Generate unified table injection block with an inner scroll wrapper context
            container.innerHTML = `
                <div class="flex flex-col h-full w-full min-h-0 text-xs font-sans">
                    
                    <!-- PANEL HEADER -->
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-zinc-100 flex-shrink-0">
                        <span class="text-xs font-bold text-zinc-700 uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-fingerprint text-teal-600"></i> ${LANG['report.section.metadata']}
                        </span>
                    </div>
                    
                    <!-- FIXED HIGH-DENSITY INNER SCROLL WRAPPER -->
                    <div class="flex-1 min-h-0 overflow-auto border border-zinc-100 rounded-lg bg-white relative">
                        <table class="w-full border-collapse text-left text-xs text-zinc-600 table-fixed">
                            <thead class="bg-zinc-50 border-b border-zinc-200 text-[10px] font-bold uppercase tracking-wider text-zinc-500 sticky top-0 z-10">
                                <tr>
                                    <th scope="col" class="w-1/3 py-2 px-3 bg-zinc-50">${LANG['text.property']}</th>
                                    <th scope="col" class="w-2/3 py-2 px-3 bg-zinc-50">${LANG['text.value']}</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-zinc-100 bg-white">
                                
                                <!-- Line 1: Artifact UID -->
                                <tr class="hover:bg-zinc-50/50 h-8">
                                    <td class="px-3 py-1 font-medium text-zinc-500 truncate bg-zinc-50/20">UID</td>
                                    <td class="px-3 py-1 text-zinc-900 font-mono text-[11px] font-bold select-all break-all">${record.uid || 'N/A'}</td>
                                </tr>

                                <!-- Core Attributes Loop (Sorted alphabetically by key) -->
                                ${sortedAttributes.map(([key, val]) => `
                                    <tr class="hover:bg-zinc-50/50 h-8">
                                        <td class="px-3 py-1 font-medium text-zinc-500 truncate capitalize bg-zinc-50/20">
                                            ${key.replace(/_/g, ' ')}
                                        </td>
                                        <td class="px-3 py-1 text-zinc-800 font-mono text-[11px] select-all break-all">
                                            ${val !== null && val !== undefined && val !== '' ? val : '-'}
                                        </td>
                                    </tr>
                                `).join('')}
                                
                                <!-- Line: Sorted Tags -->
                                <tr class="hover:bg-zinc-50/50 h-8">
                                    <td class="px-3 py-1 font-medium text-zinc-500 truncate bg-zinc-50/20">Tags</td>
                                    <td class="px-3 py-1 text-zinc-700 text-[11px] select-all break-words whitespace-pre-wrap">${sortedTags}</td>
                                </tr>

                                <!-- Application Metadata Fields Loops -->
                                ${sortedMetadata.map(meta => `
                                    <tr class="hover:bg-zinc-50/50 h-8">
                                        <td class="px-3 py-1 font-medium text-zinc-500 truncate capitalize bg-zinc-50/20">
                                            ${(meta.name || '').replace(/_/g, ' ')}
                                        </td>
                                        <td class="px-3 py-1 text-zinc-800 font-sans text-[11px] select-all break-all">
                                            ${meta.value !== null && meta.value !== 'None' ? meta.value : '-'}
                                        </td>
                                    </tr>
                                `).join('')}

                                <!-- Artifact Hash Values Loops -->
                                ${hashEntries.map(([hashType, hashValue]) => `
                                    <tr class="hover:bg-zinc-50/50 h-8">
                                        <td class="px-3 py-1 font-medium text-zinc-500 truncate uppercase bg-zinc-50/20">${hashType}</td>
                                        <td class="px-3 py-1 text-zinc-900 font-mono text-[11px] select-all break-all">${hashValue || '-'}</td>
                                    </tr>
                                `).join('')}
                                
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        // =====================================================
        // Combined/Unified Safe Boot Execution Path
        // =====================================================
        window.addEventListener('load', () => {

            // Set app version
            const versionContainer = document.getElementById('app-version');
            if (versionContainer) {
                versionContainer.textContent = window.VERSION;
            }

            // Populate extra pages
            populateExtraPages();

            // Populate case items
            populateCaseItems();
        });

        function toggleMenu(section) {
            const submenu = document.getElementById(section);
            const icon = document.getElementById(`icon-${section}`);
            if (!submenu || !icon) return;

            document.querySelectorAll('.submenu').forEach(el => {
                if (el.id !== section) {
                    el.classList.remove('open');
                    const otherIcon = document.getElementById(`icon-${el.id}`);
                    if (otherIcon) otherIcon.style.transform = 'rotate(0deg)';
                }
            });

            submenu.classList.toggle('open');
            icon.style.transform = submenu.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }
    </script>

    <!-- Load language dictionary and populate fields -->
    <script src="data/lang.js"></script>
    <script>
        function populateI18N() {
            if (typeof window.LANG === 'undefined') {
                console.warn('Language dictionary (data/lang.js) not loaded');
                return;
            }

            document.querySelectorAll('[i18n]').forEach(element => {
                const key = element.getAttribute('i18n');
                const value = window.LANG[key];
                
                if (key == 'report.title')
                    element.textContent = window.REPORT_TITLE || value;
                    
                else if (value !== undefined && value !== null && value !== '') {
                    element.textContent = value;
                } else {
                    element.textContent = '—';
                }
            });
        }

        // Populate when page loads
        document.addEventListener('DOMContentLoaded', populateI18N);
    </script>
    
</body>

</html>
